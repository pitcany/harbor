services:
  searxng:
    container_name: ${HARBOR_CONTAINER_PREFIX}.searxng
    restart: unless-stopped
    env_file:
      - ./.env
      - ./services/searxng/override.env
      # Machine-local secrets / settings path (gitignored via **/*.local.env).
      # Optional: file may be absent on fresh checkouts. Same pattern as mcpo.
      - path: ./services/searxng/override.local.env
        required: false
    image: ${HARBOR_SEARXNG_IMAGE}:${HARBOR_SEARXNG_VERSION}
    environment:
      INSTANCE_NAME: searxng
      BASE_URL: http://0.0.0.0:8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 1s
      timeout: 10s
      retries: 10
      start_period: 2s
    volumes:
      - ${HARBOR_SEARXNG_WORKSPACE}:/etc/searxng
    ports:
      - ${HARBOR_SEARXNG_HOST_PORT}:8080
    networks:
      - harbor-network

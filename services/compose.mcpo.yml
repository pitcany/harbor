services:
  mcpo:
    container_name: ${HARBOR_CONTAINER_PREFIX}.mcpo
    restart: unless-stopped
    image: ghcr.io/av/tools:latest
    ports:
      # Bound to loopback 2026-08-29. This published port had NO --api-key: from
      # another tailnet node, with no Authorization header, it served
      # filesystem/read_text_file, git_log, duckdb queries and hf_whoami (which
      # discloses the HF token's scope). The 8212 read-only proxy is the intended
      # tool boundary and returns 401; sibling wolfram-mcpo binds 172.18.0.1 WITH
      # --api-key. Open WebUI reaches this container as http://mcpo:8000 over the
      # docker network and does not use the published port at all.
      - 127.0.0.1:${HARBOR_MCPO_HOST_PORT}:8000
    volumes:
      - ./services/mcp/cache:/app/cache
      - ./services/mcp/data:/app/data
      - ./shared/json_config_merger.py:/app/json_config_merger.py
      - ./services/mcpo/start_mcpo.sh:/app/start_mcpo.sh
      - ./services/mcpo/configs/mcpo.override.json:/app/configs/z.config.json
      # filesystem MCP root (read-only). LLM can list/read but cannot write.
      - /home/yannik/AI:/workspace/AI:ro
    entrypoint: ["/app/start_mcpo.sh"]
    env_file:
      - ./.env
      - ./services/mcp/override.env
      - ./services/mcpo/override.env
      # Machine-local secrets (gitignored via **/*.local.env).
      # Optional: file may be absent on fresh checkouts.
      - path: ./services/mcpo/override.local.env
        required: false
    networks:
      - harbor-network

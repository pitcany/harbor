services:
  ollama:
    image: ollama/ollama:${HARBOR_OLLAMA_VERSION}
    container_name: ${HARBOR_CONTAINER_PREFIX}.ollama
    env_file:
      - ./.env
      - ./services/ollama/override.env
    volumes:
      - ${HARBOR_OLLAMA_CACHE}:/root/.ollama
      - ${HARBOR_HF_CACHE}:/root/.cache/huggingface
      - ${HARBOR_LLAMACPP_CACHE}:/root/.cache/llama.cpp
      - ${HARBOR_VLLM_CACHE}:/root/.cache/vllm
      - ./services/ollama/modelfiles:/modelfiles
      # Tidy-tide (2026-05-12): the canonical model store lives at
      # ~/AI/models/store on the host. ~/.ollama/gguf is a symlink into
      # it, and generated Modelfiles use FROM /home/yannik/AI/models/store/...
      # — those paths must resolve inside the container too, hence this
      # same-path bind-mount. Read-only is sufficient (Ollama copies bytes
      # into its own internal blob store at `ollama create` time).
      # Override via HARBOR_TIDY_TIDE_STORE in ~/.harbor/.env if you ever
      # relocate the canonical root. See ~/AI/models/README.md.
      - ${HARBOR_TIDY_TIDE_STORE:-/home/yannik/AI/models/store}:/home/yannik/AI/models/store:ro
    tty: true
    ports:
      - ${HARBOR_OLLAMA_HOST_PORT}:11434
    healthcheck:
      test: ["CMD-SHELL", "bash -c '{ printf \"GET / HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3; } 3<>/dev/tcp/localhost/11434 | grep -q \"Ollama is\" || exit 1'"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - harbor-network

  # Runs an "init" script once during the first start
  # of ollama service
  ollama-init:
    container_name: ${HARBOR_CONTAINER_PREFIX}.ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    image: ollama/ollama:${HARBOR_OLLAMA_VERSION}
    env_file:
      - ./.env
      - ./services/ollama/override.env
    volumes:
      - ${HARBOR_OLLAMA_CACHE}:/root/.ollama
      - ./services/ollama/init_entrypoint.sh:/init_entrypoint.sh
    entrypoint: /init_entrypoint.sh
    tty: true
    networks:
      - harbor-network
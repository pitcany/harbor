services:
  boost:
    container_name: ${HARBOR_CONTAINER_PREFIX}.boost
    build:
      context: ./services/boost
      dockerfile: Dockerfile
    env_file:
      - ./.env
      - ./services/boost/override.env
    volumes:
      - ./services/boost/src:/boost
      - /boost/.venv
      - ${HARBOR_OLLAMA_CACHE}:/root/.ollama
      - ${HARBOR_HF_CACHE}:/root/.cache/huggingface
      - ${HARBOR_LLAMACPP_CACHE}:/root/.cache/llama.cpp
      - ${HARBOR_VLLM_CACHE}:/root/.cache/vllm
    ports:
      - ${HARBOR_BOOST_HOST_PORT}:8000
    networks:
      - harbor-network
    # Override the upstream Dockerfile CMD to drop `--reload`.
    # Reason: the bind-mount `./services/boost/src:/boost` plus uvicorn's
    # `--reload` means any save under that tree hard-kills boost, dropping
    # in-flight SSE streams. With DeepSeek-R1 the front-end stays stuck in
    # "Thinking..." forever because `</think>` never streams.
    # Also raise `--timeout-graceful-shutdown` from 0 to 30s so a normal
    # `harbor restart boost` drains running requests instead of guillotining.
    # See harbor-setup-notes.md §8 for context.
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "30"]
